- body: "シェイプ、線、テキストを GLSL シェーダーで塗ったり、レイヤー全体にエフェクトとしてかけたりできます。25 種類のプリセットから始めて自動で作られるコントロールで調整し、アニメーションはキャンバスの上でそのまま動きます。"
  detail: "set_shader  list_shaders"
  num: "V"
  title: "シェーダーの塗りとエフェクト"
- body: "つないだレイヤーから離れないコネクタ、1 回で済むダイアグラムのレイアウト、シーケンス図、スイムレーン、CSV からのグラフ。Mermaid、Excalidraw、draw.io のファイルを読み込み、その形式で書き出すこともできます。"
  detail: "layout_diagram  import_code"
  num: "VI"
  title: "ダイアグラムとグラフ"
- body: "Claude Code、Codex、そのほかの MCP クライアントが、内蔵エージェントと同じツールで、開いているドキュメントをデザインできます。"
  detail: "設定 ▸ MCP"
  num: "VII"
  title: "あなたのエージェントのための MCP サーバー"
- body: "変数、テキストスタイル、コンポーネントをひとつのパッケージに。どのドキュメントにもリンクでき、トークンを一度変えればすべての画面に反映されます。"
  detail: "link_design_system"
  num: "VIII"
  title: "パッケージとしてのデザインシステム"
- body: "デザインを Inkwell のウェブサイトテーマに、複数の言語で。このサイトもそのひとつで、Silverpoint で描いて Silverpoint から公開しています。"
  detail: "ウェブサイトを公開…"
  num: "IX"
  title: "ウェブサイトを公開"
- body: "スキルでエージェントにあなたのルールを教え、リントルールで確かめ、フックで保存や書き出しのあとにコマンドを実行し、プラグインでインポーターやコードターゲットを追加できます。"
  detail: "save_skill  save_lint_rule"
  num: "X"
  title: "スキル、リントルール、フック、プラグイン"
- body: "SwiftUI、UIKit、Compose、React、HTML への書き出し、編集したコードの読み戻し、Figma ファイルの読み込み。動作はしますが、ベータのほかの部分ほどテストされていないので、粗い部分があるかもしれません。"
  detail: "export_code  import_figma"
  num: "XI"
  title: "コードと Figma の行き来（初期段階）"
